name: Build Hermes Light for Mac

on:
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Official stable Hermes tag (empty = latest)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 10,23 * * *'
      timezone: 'Europe/Paris'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hermes-light-mac-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Test automation and select release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Test release selection and package validation
        run: python -m unittest discover -s tests -v
      - name: Select an unpublished stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          VALIDATION_ONLY: ${{ github.event_name == 'pull_request' }}
        run: python scripts/resolve.py --output release-request.json
      - name: Preserve exact source identity
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: release-request
          path: release-request.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build macOS ARM64 without Apple credentials
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: release-request
      - name: Check Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          xcode-select -p
          df -h .
      - name: Fetch and verify the unmodified official sources
        run: python scripts/prepare_source.py --manifest release-request.json --source upstream
      - name: Compile Light DMG and ZIP
        run: python scripts/build_macos.py --manifest release-request.json --source upstream 2>&1 | tee build.log
      - name: Validate and collect installers
        run: python scripts/package_macos.py --manifest release-request.json --source upstream --output dist
      - name: Upload verified installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: hermes-light-mac-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: build-diagnostics
          path: |
            build.log
            release-request.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish downloadable installers
    needs: [resolve, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: hermes-light-mac-arm64
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish.py --directory dist
